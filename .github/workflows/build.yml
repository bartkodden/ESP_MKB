name: Build ESP32 Firmware & Windows App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================
  # ESP32 Firmware Build
  # ============================================
  build-firmware:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5        # ← v5 uses Node.js 24
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    # Docker login removed — was causing "Username and password required" error
    # when secrets aren't set. Not needed for public ESP-IDF image.

    - name: Generate icons font subset
      run: |
        cd firmware/main/scripts
        npm install -g lv_font_conv
        python3 gen_icons.py --no-font  # generate header + JS only, skip font (no TTF in CI)
      continue-on-error: true

    - name: Setup ESP-IDF and Build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v5.4.3
        target: esp32
        path: 'firmware'
        command: >
          idf.py build

    - name: Fix Build Directory Permissions
      run: |
        sudo chown -R runner:runner firmware/build || true

    - name: Generate Build Info
      working-directory: firmware/build
      run: |
        echo "# ESP32 Firmware Build" > build-info.txt
        echo "Build Date: $(date)" >> build-info.txt
        echo "Commit: ${{ github.sha }}" >> build-info.txt
        echo "Branch: ${{ github.ref_name }}" >> build-info.txt
        echo "" >> build-info.txt
        echo "## Binary Files:" >> build-info.txt
        ls -lh *.bin >> build-info.txt 2>/dev/null || echo "No .bin files found" >> build-info.txt
        echo "" >> build-info.txt
        echo "## Checksums:" >> build-info.txt
        sha256sum *.bin 2>/dev/null | tee firmware-checksums.txt || echo "No binaries to checksum"

    - name: Upload Firmware Binaries
      uses: actions/upload-artifact@v4
      with:
        name: esp32-firmware-${{ github.sha }}
        path: |
          firmware/build/*.bin
          firmware/build/bootloader/bootloader.bin
          firmware/build/partition_table/partition-table.bin
          firmware/build/build-info.txt
          firmware/build/firmware-checksums.txt
        retention-days: 30

    - name: Upload Flash Instructions
      uses: actions/upload-artifact@v4
      with:
        name: flash-instructions-${{ github.sha }}
        path: firmware/build/flasher_args.json
        retention-days: 30
      continue-on-error: true

  # ============================================
  # Windows App Build
  # ============================================
  build-windows-app:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Display .NET Info
      run: dotnet --info

    - name: Restore Dependencies
      working-directory: app/win
      run: dotnet restore

    - name: Build Release
      working-directory: app/win
      run: dotnet build --configuration Release --no-restore

    - name: Publish Self-Contained (Windows x64)
      working-directory: app/win
      run: |
        dotnet publish --configuration Release --runtime win-x64 --self-contained true --output ../../publish/win-x64

    - name: Publish Framework-Dependent
      working-directory: app/win
      run: |
        dotnet publish --configuration Release --output ../../publish/framework-dependent

    - name: Create Build Info
      shell: pwsh
      run: |
        @"
        # Windows MCS Server Build
        Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
        Commit: ${{ github.sha }}
        Branch: ${{ github.ref_name }}
        "@ | Out-File -FilePath publish/BUILD-INFO.txt -Encoding UTF8

    - name: Upload Self-Contained Build
      uses: actions/upload-artifact@v4
      with:
        name: windows-app-standalone-${{ github.sha }}
        path: publish/win-x64/**/*
        retention-days: 30

    - name: Upload Framework-Dependent Build
      uses: actions/upload-artifact@v4
      with:
        name: windows-app-portable-${{ github.sha }}
        path: publish/framework-dependent/**/*
        retention-days: 30

  # ============================================
  # Create GitHub Release (on tags only)
  # ============================================
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-firmware, build-windows-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5        # ← v5

    - name: Download Firmware
      uses: actions/download-artifact@v4
      with:
        name: esp32-firmware-${{ github.sha }}
        path: release/firmware

    - name: Download Flash Instructions
      uses: actions/download-artifact@v4
      with:
        name: flash-instructions-${{ github.sha }}
        path: release/firmware
      continue-on-error: true

    - name: Download Windows App (Standalone)
      uses: actions/download-artifact@v4
      with:
        name: windows-app-standalone-${{ github.sha }}
        path: release/windows-standalone

    - name: Download Windows App (Portable)
      uses: actions/download-artifact@v4
      with:
        name: windows-app-portable-${{ github.sha }}
        path: release/windows-portable

    - name: Create ZIP Archives
      run: |
        cd release/firmware
        zip -r ../ESP32-Firmware-${{ github.ref_name }}.zip .
        cd ../windows-standalone
        zip -r ../Windows-App-Standalone-${{ github.ref_name }}.zip .
        cd ../windows-portable
        zip -r ../Windows-App-Portable-${{ github.ref_name }}.zip .

    - name: Create Release
      uses: softprops/action-gh-release@v2   # ← v2 uses Node.js 24
      with:
        files: |
          release/*.zip
          release/firmware/*.bin
          release/firmware/build-info.txt
          release/firmware/firmware-checksums.txt
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}