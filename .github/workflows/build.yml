name: Build ESP32 Firmware & Windows App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================
  # ESP32 Firmware Build
  # ============================================
  build-firmware:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

    - name: Install Node.js and lv_font_conv
      run: |
        curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
        sudo apt-get install -y nodejs
        npm install -g lv_font_conv
        lv_font_conv --version

    - name: Generate menu.json (AP mode for CI)
      run: python3 firmware/main/scripts/gen_menu.py --ap

    - name: Generate Material Icons font subset
      run: |
        cd firmware/main/scripts
        python3 gen_icons.py
        ls -lh ../material_icons_used_24.c

    - name: Setup ESP-IDF and Build
      uses: espressif/esp-idf-ci-action@v2
      with:
        esp_idf_version: v5.4.3
        target: esp32
        path: 'firmware'
        command: idf.py build

    - name: Fix Build Directory Permissions
      run: sudo chown -R runner:runner firmware/build || true

    - name: Generate Build Info
      working-directory: firmware/build
      run: |
        echo "# ESP32 Firmware Build" > build-info.txt
        echo "Build Date: $(date)" >> build-info.txt
        echo "Commit: ${{ github.sha }}" >> build-info.txt
        echo "Branch: ${{ github.ref_name }}" >> build-info.txt
        echo "" >> build-info.txt
        echo "## Binary Files:" >> build-info.txt
        ls -lh *.bin >> build-info.txt 2>/dev/null || echo "No .bin files found"
        echo "" >> build-info.txt
        echo "## Checksums:" >> build-info.txt
        sha256sum *.bin 2>/dev/null | tee firmware-checksums.txt || echo "No binaries"

    - name: Upload Firmware Binaries
      uses: actions/upload-artifact@v4
      with:
        name: esp32-firmware-${{ github.sha }}
        path: |
          firmware/build/*.bin
          firmware/build/bootloader/bootloader.bin
          firmware/build/partition_table/partition-table.bin
          firmware/build/build-info.txt
          firmware/build/firmware-checksums.txt
        retention-days: 30

    - name: Upload Flash Instructions
      uses: actions/upload-artifact@v4
      with:
        name: flash-instructions-${{ github.sha }}
        path: firmware/build/flasher_args.json
        retention-days: 30
      continue-on-error: true

  # ============================================
  # Windows App Build
  # ============================================
  build-windows-app:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Install Windows 10 SDK (UAP Platform files)
      shell: pwsh
      run: |
        # The github-hosted windows-latest runner has VS but is missing
        # the UAP platform files needed by CsWinRT/WinRT projects.
        # Install via VS installer silently.
        $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
        $vsPath = (Get-VSSetupInstance | Select-Object -First 1).InstallationPath
        
        Write-Host "VS path: $vsPath"
        
        Start-Process -Wait -FilePath $installer -ArgumentList `
          "modify", `
          "--installPath", "`"$vsPath`"", `
          "--add", "Microsoft.VisualStudio.Component.Windows10SDK.19041", `
          "--quiet", "--norestart"
        
        # Verify
        $uapPath = "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP\10.0.19041.0\Platform.xml"
        if (Test-Path $uapPath) {
          Write-Host "OK Platform.xml found"
        } else {
          Write-Host "WARN Platform.xml still missing - trying alternative"
          # Alternative: install via winget
          winget install --id Microsoft.WindowsSDK.10.0.19041 --silent --accept-package-agreements --accept-source-agreements
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      working-directory: app/win
      run: dotnet restore

    - name: Build Release
      working-directory: app/win
      run: dotnet build --configuration Release --no-restore

    - name: Publish Self-Contained (Windows x64)
      working-directory: app/win
      run: |
        dotnet publish --configuration Release --runtime win-x64 --self-contained true --output ../../publish/win-x64

    - name: Publish Framework-Dependent
      working-directory: app/win
      run: |
        dotnet publish --configuration Release --output ../../publish/framework-dependent

    - name: Create Build Info
      shell: pwsh
      run: |
        @"
        # Windows MCS Server Build
        Build Date: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
        Commit: ${{ github.sha }}
        Branch: ${{ github.ref_name }}
        "@ | Out-File -FilePath publish/BUILD-INFO.txt -Encoding UTF8

    - name: Upload Self-Contained Build
      uses: actions/upload-artifact@v4
      with:
        name: windows-app-standalone-${{ github.sha }}
        path: publish/win-x64/**/*
        retention-days: 30

    - name: Upload Framework-Dependent Build
      uses: actions/upload-artifact@v4
      with:
        name: windows-app-portable-${{ github.sha }}
        path: publish/framework-dependent/**/*
        retention-days: 30

  # ============================================
  # Create GitHub Release (on tags only)
  # ============================================
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-firmware, build-windows-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v5        # ← v5

    - name: Download Firmware
      uses: actions/download-artifact@v4
      with:
        name: esp32-firmware-${{ github.sha }}
        path: release/firmware

    - name: Download Flash Instructions
      uses: actions/download-artifact@v4
      with:
        name: flash-instructions-${{ github.sha }}
        path: release/firmware
      continue-on-error: true

    - name: Download Windows App (Standalone)
      uses: actions/download-artifact@v4
      with:
        name: windows-app-standalone-${{ github.sha }}
        path: release/windows-standalone

    - name: Download Windows App (Portable)
      uses: actions/download-artifact@v4
      with:
        name: windows-app-portable-${{ github.sha }}
        path: release/windows-portable

    - name: Create ZIP Archives
      run: |
        cd release/firmware
        zip -r ../ESP32-Firmware-${{ github.ref_name }}.zip .
        cd ../windows-standalone
        zip -r ../Windows-App-Standalone-${{ github.ref_name }}.zip .
        cd ../windows-portable
        zip -r ../Windows-App-Portable-${{ github.ref_name }}.zip .

    - name: Create Release
      uses: softprops/action-gh-release@v2   # ← v2 uses Node.js 24
      with:
        files: |
          release/*.zip
          release/firmware/*.bin
          release/firmware/build-info.txt
          release/firmware/firmware-checksums.txt
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}